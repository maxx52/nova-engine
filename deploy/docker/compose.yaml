name: nova
x-logs: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      NOVA_DB_PASSWORD: ${NOVA_DB_PASSWORD:?Set NOVA_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-nova.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d nova"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logs
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://nova_app:${NOVA_DB_PASSWORD:?Set NOVA_DB_PASSWORD}@db:5432/nova
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY}
      ADMIN_ORIGINS: https://${NOVA_DOMAIN:?Set NOVA_DOMAIN}
      TRUST_PROXY: 172.30.92.2
      SESSION_SECURE: "true"
    volumes:
      - uploads:/var/lib/nova/uploads
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logs
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NOVA_DOMAIN: ${NOVA_DOMAIN:?Set NOVA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certificates:/data
      - caddy_config:/config
    networks:
      application:
        ipv4_address: 172.30.92.2
    depends_on:
      api:
        condition: service_healthy
    security_opt: [no-new-privileges:true]
    logging: *logs
networks:
  application:
    ipam:
      config:
        - subnet: 172.30.92.0/24
  database:
    internal: true
volumes:
  database:
  uploads:
  certificates:
  caddy_config:
