# Include only inside location / for the public storefront.
# The API supplies all response security headers, including per-document CSP.
# A local add_header disables inherited add_header directives on standard nginx.
add_header X-Nova-SEO server always;
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 20s;
