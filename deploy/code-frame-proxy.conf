# Include ONLY in an exact location = /api/code-frame {} block.
# This add_header disables inherited server add_header directives in standard nginx;
# all security headers, including the nonce CSP and sandbox, come from the API.
add_header X-Nova-Code-Frame sandbox always;
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_read_timeout 20s;
