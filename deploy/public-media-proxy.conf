# Include inside location /uploads/ {}. Preserve the API image headers,
# including CORP cross-origin for images displayed in an opaque sandbox.
# This location-level header prevents inheritance of the HTML document CSP.
add_header X-Nova-Public-Media image always;
proxy_pass http://127.0.0.1:3001;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Cookie "";
proxy_connect_timeout 5s;
proxy_read_timeout 20s;
