name: Security and build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: python3 -m unittest discover -s deploy/updater/tests -v
      - name: Verify protected native preparation on systemd
        run: sudo python3 scripts/check-native-preparation.py "$(id -un)"
      - run: npm run build
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate installer and invalid input handling
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --help
          if bash scripts/install.sh --domain 'bad;domain'; then exit 1; fi
          if bash scripts/install.sh --resume --domain shop.example.ru; then exit 1; fi
      - name: Start disposable production containers
        run: |
          set -o pipefail
          umask 077
          printf 'NOVA_DOMAIN=localhost\nPOSTGRES_PASSWORD=%s\nNOVA_DB_PASSWORD=%s\nADMIN_API_KEY=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          docker compose --env-file .env -f deploy/docker/compose.yaml config --quiet
          docker compose --env-file .env -f deploy/docker/compose.yaml up -d --build --wait --wait-timeout 240 2>&1 | tee /tmp/nova-deploy.log
      - name: Check local TLS, setup, packages and restart persistence
        run: |
          for attempt in $(seq 1 20); do
            if docker compose --env-file .env -f deploy/docker/compose.yaml cp web:/data/caddy/pki/authorities/local/root.crt /tmp/nova-ca.crt; then break; fi
            sleep 2
          done
          export NOVA_TEST_CA=/tmp/nova-ca.crt
          export ADMIN_API_KEY="$(sed -n 's/^ADMIN_API_KEY=//p' .env)"
          python3 scripts/check-deployment.py
          docker compose --env-file .env -f deploy/docker/compose.yaml restart api db
          docker compose --env-file .env -f deploy/docker/compose.yaml up -d --wait --wait-timeout 240
          NOVA_TEST_RESTART=1 python3 scripts/check-deployment.py
          python3 scripts/check-manager-deployment.py
          npm install --prefix /tmp/nova-ui-test --no-save --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          NOVA_PLAYWRIGHT_MODULE=/tmp/nova-ui-test/node_modules/playwright-core/index.mjs node scripts/check-system-ui.mjs
      - name: Diagnostic logs on failure
        if: failure()
        run: |
          docker compose --env-file .env -f deploy/docker/compose.yaml ps -a
          tail -n 30 /tmp/nova-deploy.log | python3 -c 'import sys; s=sys.stdin.read(); print("::error title=Build diagnostics::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
          docker compose --env-file .env -f deploy/docker/compose.yaml logs --tail=25 api web db | python3 -c 'import sys; s=sys.stdin.read(); print("::error title=Disposable deployment diagnostics::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'
      - name: Remove disposable containers
        if: always()
        run: docker compose --env-file .env -f deploy/docker/compose.yaml down -v
